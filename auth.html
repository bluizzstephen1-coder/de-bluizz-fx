<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DE.Bluizz FX — Member Access</title>
<style>
body{margin:0;background:#070707;color:#eee;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{width:min(430px,92%);background:#111;border:1px solid #3c3018;border-radius:18px;padding:28px;box-shadow:0 15px 50px #000}
h1{color:#d7ad45}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1;padding:12px;border:1px solid #4a3a1b;background:#171717;color:#ddd;border-radius:10px}.tabs .on{background:#d7ad45;color:#080808}
input{width:100%;box-sizing:border-box;margin:8px 0;padding:13px;border-radius:9px;border:1px solid #444;background:#080808;color:#fff}
.action{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;background:#d7ad45;font-weight:700}
.msg{margin-top:15px;color:#f4d27a;line-height:1.5}
small{color:#999}.back{color:#d7ad45;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<a class="back" href="index.html">← DE.Bluizz FX</a>
<h1>Member Access</h1>
<small>Create your account or sign in to access your private trader dashboard.</small>
<div class="tabs"><button id="loginTab" class="on">Login</button><button id="signupTab">Create account</button></div>
<form id="form">
<input id="name" placeholder="Full name" style="display:none">
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password (minimum 6 characters)" required>
<button class="action" id="submit">Login</button>
</form>
<div class="msg" id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
let mode="login";
const $=id=>document.getElementById(id);
function setMode(m){mode=m;$("loginTab").classList.toggle("on",m==="login");$("signupTab").classList.toggle("on",m==="signup");$("name").style.display=m==="signup"?"block":"none";$("submit").textContent=m==="signup"?"Create account":"Login";$("msg").textContent=""}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");
$("form").onsubmit=async e=>{
 e.preventDefault();
 if(!window.supabaseClient){$("msg").textContent="Connect your Supabase project first by editing supabase.js.";return}
 const email=$("email").value.trim(), password=$("password").value;
 let r;
 if(mode==="signup") r=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:$("name").value.trim()}}});
 else r=await supabaseClient.auth.signInWithPassword({email,password});
 if(r.error){$("msg").textContent=r.error.message;return}
 if(mode==="signup"){$("msg").textContent="Account created. Check your email if confirmation is enabled, then log in."}
 else location.href="dashboard.html";
};
</script>
</body></html>
