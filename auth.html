<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070d">
<title>DE.Bluizz FX — Member Access</title>

<style>
:root {
  --blue: #168bff;
  --blue-light: #73c7ff;
  --blue-dark: #0755a8;
  --black: #05070d;
  --panel: #0b1220;
  --border: rgba(22, 139, 255, 0.35);
  --text: #f2f7ff;
  --muted: #a4b2c8;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  padding: 25px 14px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 0%, #071a35 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, #061329 0%, transparent 45%),
    var(--black);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

/* Animated blue atmosphere */
body::before,
body::after {
  content: "";
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(95px);
  opacity: 0.17;
  pointer-events: none;
  z-index: -1;
}

body::before {
  top: -140px;
  left: -120px;
  background: #168bff;
  animation: ambientLight 9s ease-in-out infinite alternate;
}

body::after {
  right: -150px;
  bottom: -140px;
  background: #0755a8;
  animation: ambientLight 11s ease-in-out infinite alternate-reverse;
}

/* Main login card */
.card {
  position: relative;
  width: min(440px, 100%);
  padding: 34px 28px;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(145deg, #111c2e, #080d17 75%);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.75),
    0 0 35px rgba(22, 139, 255, 0.09);
  animation: cardEntrance 0.8s cubic-bezier(.2,.8,.2,1) both;
}

/* Moving blue light along the top border */
.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 80%;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--blue-light),
    transparent
  );
  box-shadow: 0 0 18px var(--blue);
  animation: borderSweep 5s ease-in-out infinite;
  pointer-events: none;
}

/* Subtle animated card reflection */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    115deg,
    transparent 25%,
    rgba(115, 199, 255, 0.035) 45%,
    transparent 65%
  );
  background-size: 250% 100%;
  animation: cardShimmer 8s ease-in-out infinite;
  pointer-events: none;
  z-index: -1;
}

/* Brand emblem */
.brand-mark {
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  margin: 0 auto 20px;
  border: 1px solid rgba(22, 139, 255, 0.7);
  border-radius: 20px;
  background: linear-gradient(145deg, #0a1c35, #080d17);
  color: var(--blue-light);
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -2px;
  box-shadow:
    0 0 25px rgba(22, 139, 255, 0.14),
    inset 0 0 18px rgba(22, 139, 255, 0.06);
  animation: logoGlow 3s ease-in-out infinite;
}

.brand-name {
  text-align: center;
  margin-bottom: 28px;
}

.brand-name strong {
  display: block;
  color: var(--blue-light);
  font-size: 15px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.brand-name span {
  display: block;
  margin-top: 8px;
  color: #8596b0;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.back {
  display: inline-block;
  margin-bottom: 12px;
  color: var(--blue-light);
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  transition: color 0.25s, transform 0.25s;
}

.back:hover {
  color: #ffffff;
  transform: translateX(-3px);
}

h1 {
  margin: 5px 0 12px;
  color: var(--blue-light);
  font-size: clamp(27px, 6vw, 34px);
  letter-spacing: 0.4px;
}

.card > small {
  display: block;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

/* Login and signup tabs */
.tabs {
  display: flex;
  gap: 10px;
  margin: 25px 0 20px;
  padding: 5px;
  border: 1px solid #1b2b42;
  border-radius: 13px;
  background: #070b13;
}

.tabs button {
  flex: 1;
  min-height: 44px;
  padding: 11px 8px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: #b2bfd2;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background 0.25s,
    color 0.25s,
    border-color 0.25s,
    box-shadow 0.25s;
}

.tabs button:hover {
  border-color: var(--border);
  color: var(--blue-light);
}

.tabs .on {
  border-color: var(--blue);
  background: linear-gradient(135deg, #73c7ff, #0878e8);
  color: #04101f;
  box-shadow: 0 3px 18px rgba(22, 139, 255, 0.22);
}

/* Form inputs */
#form > input,
.password-wrap input {
  display: block;
  width: 100%;
  min-height: 49px;
  margin: 12px 0;
  padding: 14px;
  border: 1px solid #29364a;
  border-radius: 10px;
  outline: none;
  background: #070b13;
  color: #ffffff;
  font-family: inherit;
  font-size: 14px;
  transition:
    border-color 0.25s,
    box-shadow 0.25s,
    background 0.25s;
}

#form > input:focus,
.password-wrap input:focus {
  border-color: var(--blue);
  background: #09101d;
  box-shadow: 0 0 0 3px rgba(22, 139, 255, 0.12);
}

input::placeholder {
  color: #8290a6;
  opacity: 1;
}

.password-wrap {
  position: relative;
  width: 100%;
}

.password-wrap input {
  padding-right: 75px;
}

.toggle-pass {
  position: absolute;
  top: 50%;
  right: 7px;
  transform: translateY(-50%);
  padding: 9px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--blue-light);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

.toggle-pass:hover {
  color: #ffffff;
}

/* Animated submit button */
.action {
  position: relative;
  width: 100%;
  min-height: 50px;
  margin-top: 14px;
  padding: 14px;
  overflow: hidden;
  border: 1px solid #73c7ff;
  border-radius: 10px;
  background: linear-gradient(
    120deg,
    #73c7ff,
    #168bff,
    #0878e8
  );
  background-size: 200% 100%;
  color: #04101f;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.5px;
  cursor: pointer;
  box-shadow: 0 5px 22px rgba(22, 139, 255, 0.17);
  transition:
    transform 0.2s,
    box-shadow 0.25s,
    background-position 0.5s;
}

.action:hover {
  transform: translateY(-2px);
  background-position: 100% 0;
  box-shadow: 0 8px 30px rgba(22, 139, 255, 0.35);
}

.action:active {
  transform: scale(0.985);
}

.action:disabled {
  opacity: 0.65;
  cursor: wait;
  transform: none;
}

/* Moving light streak */
.action::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -70%;
  width: 35%;
  height: 200%;
  transform: rotate(25deg);
  background: rgba(255, 255, 255, 0.3);
  animation: buttonShine 4.5s ease-in-out infinite;
  pointer-events: none;
}

.msg {
  min-height: 8px;
  margin-top: 18px;
  color: var(--blue-light);
  font-size: 13px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.footer {
  margin-top: 25px;
  padding-top: 17px;
  border-top: 1px solid rgba(22, 139, 255, 0.16);
  color: #7f8da3;
  text-align: center;
  font-size: 10px;
  letter-spacing: 1.3px;
  line-height: 1.8;
}

.footer span {
  color: var(--blue-light);
}

/* Animations */
@keyframes cardEntrance {
  from {
    opacity: 0;
    transform: translateY(24px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes ambientLight {
  from {
    transform: translate(0, 0) scale(0.9);
  }
  to {
    transform: translate(45px, 35px) scale(1.15);
  }
}

@keyframes logoGlow {
  0%, 100% {
    box-shadow:
      0 0 18px rgba(22, 139, 255, 0.12),
      inset 0 0 15px rgba(22, 139, 255, 0.04);
  }
  50% {
    box-shadow:
      0 0 30px rgba(22, 139, 255, 0.32),
      inset 0 0 20px rgba(22, 139, 255, 0.1);
  }
}

@keyframes borderSweep {
  0% {
    left: -120%;
  }
  55%, 100% {
    left: 140%;
  }
}

@keyframes cardShimmer {
  0%, 100% {
    background-position: 100% 0;
  }
  50% {
    background-position: -100% 0;
  }
}

@keyframes buttonShine {
  0%, 65% {
    left: -70%;
  }
  85%, 100% {
    left: 140%;
  }
}

/* Keyboard accessibility */
button:focus-visible,
.back:focus-visible {
  outline: 2px solid var(--blue-light);
  outline-offset: 3px;
}

@media (max-width: 480px) {
  body {
    padding: 18px 12px;
  }

  .card {
    padding: 27px 21px;
    border-radius: 18px;
  }

  .brand-mark {
    width: 60px;
    height: 60px;
    font-size: 23px;
  }

  .tabs {
    gap: 7px;
  }
}

/* Respect reduced-motion settings */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="card">

  <div class="brand-mark" aria-label="DE.Bluizz FX emblem">DB</div>

  <div class="brand-name">
    <strong>DE.Bluizz FX</strong>
    <span>Trade smart · Build discipline</span>
  </div>

  <a class="back" href="index.html">← Back to Home</a>

  <h1>Member Access</h1>

  <small>
    Sign in or create your account to access your private trader dashboard.
  </small>

  <div class="tabs">
    <button type="button" id="loginTab" class="on">Login</button>
    <button type="button" id="signupTab">Create account</button>
  </div>

  <form id="form">
    <input
      id="name"
      type="text"
      placeholder="Full name"
      autocomplete="name"
      style="display:none"
    >

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
      required
    >

    <div class="password-wrap">
      <input
        id="password"
        type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button
        type="button"
        class="toggle-pass"
        id="togglePassword"
        aria-label="Show password"
      >Show</button>
    </div>

    <button class="action" id="submit" type="submit">Login</button>
  </form>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="footer">
    BUILT FOR TRADERS WHO WANT MORE<br>
    <span>DE.Bluizz FX V7 Trader Hub</span>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
"use strict";

let mode = "login";

const $ = id => document.getElementById(id);

function setMessage(message) {
  $("msg").textContent = message;
}

function setMode(newMode) {
  mode = newMode;

  const signup = mode === "signup";

  $("loginTab").classList.toggle("on", !signup);
  $("signupTab").classList.toggle("on", signup);

  $("name").style.display = signup ? "block" : "none";
  $("name").required = signup;

  $("password").autocomplete = signup
    ? "new-password"
    : "current-password";

  $("submit").textContent = signup
    ? "Create account"
    : "Login";

  setMessage("");
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("signupTab").addEventListener("click", () => setMode("signup"));

$("togglePassword").addEventListener("click", () => {
  const password = $("password");
  const toggle = $("togglePassword");
  const show = password.type === "password";

  password.type = show ? "text" : "password";
  toggle.textContent = show ? "Hide" : "Show";
  toggle.setAttribute(
    "aria-label",
    show ? "Hide password" : "Show password"
  );
});

$("form").addEventListener("submit", async event => {
  event.preventDefault();

  const submitButton = $("submit");

  if (!window.supabaseClient) {
    setMessage(
      "Supabase is not connected. Please check your supabase.js configuration."
    );
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  const fullName = $("name").value.trim();

  if (password.length < 6) {
    setMessage("Your password must contain at least 6 characters.");
    return;
  }

  if (mode === "signup" && !fullName) {
    setMessage("Please enter your full name.");
    $("name").focus();
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = mode === "signup"
    ? "Creating account..."
    : "Signing in...";

  setMessage("");

  try {
    let result;

    if (mode === "signup") {
      result = await window.supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName
          }
        }
      });
    } else {
      result = await window.supabaseClient.auth.signInWithPassword({
        email,
        password
      });
    }

    if (result.error) {
      setMessage(result.error.message);
      return;
    }

    if (mode === "signup") {
      if (result.data.session) {
        setMessage("Account created successfully. Opening your dashboard...");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 700);
      } else {
        setMessage(
          "Account created. Check your email if confirmation is enabled, then return here to log in."
        );
      }
    } else {
      setMessage("Login successful. Opening your dashboard...");

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 400);
    }
  } catch (error) {
    setMessage(
      error && error.message
        ? error.message
        : "Something went wrong. Please try again."
    );
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = mode === "signup"
      ? "Create account"
      : "Login";
  }
});
</script>
</body>
</html>
